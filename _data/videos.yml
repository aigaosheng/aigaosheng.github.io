# AI music videos and short dramas shown on /videos/ (videos.html).
#
# Add one entry per video, in any order -- the page sorts by date.
# Paste the normal share link; the video ID is read from it.
#
#   title:     Video title (required)
#   url:       Full YouTube or TikTok link (required). Accepted forms:
#                https://www.youtube.com/watch?v=VIDEO_ID
#                https://youtu.be/VIDEO_ID
#                https://www.youtube.com/shorts/VIDEO_ID
#                https://music.youtube.com/watch?v=VIDEO_ID
#                https://www.tiktok.com/@aisengtech/video/1234567890123456789
#              TikTok short links (vt.tiktok.com/...) do NOT carry the ID:
#              open them in a browser and copy the full link instead.
#   kind:      music | drama   (label on the card; leave out for no label)
#   date:      YYYY-MM-DD      (newest first; undated videos come after
#              dated ones, the lowest in this file first)
#   tools:     AI tools used, e.g. "Suno, Kling" (optional)
#   note:      One or two lines about the video (optional)
#   thumbnail: /image/videos/xyz.jpg (optional; TikTok has no public
#              thumbnail URL, so without this a TikTok card shows a
#              coloured placeholder. YouTube thumbnails are automatic.)
#
# Example:
#
# - title: "Neon Rain"
#   url: https://youtu.be/dQw4w9WgXcQ
#   kind: music
#   date: 2026-11-01
#   tools: "Suno v5, Runway"
#   note: "Synthwave about a late-night drive through Singapore."

