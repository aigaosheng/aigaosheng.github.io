<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" role="img" aria-labelledby="f2t f2d">
<title id="f2t">Two reported incident rates that answer different questions</title>
<desc id="f2d">Anthropic reported 6 affected runs out of 141,006. UK AISI reported 10 out of 122. The two organisations counted different things in differently configured environments, so the ratio between the two rates carries no meaning.</desc>
<style>
  .m{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace}
  .n{font-family:'IBM Plex Sans Condensed','IBM Plex Sans','Helvetica Neue',Arial,sans-serif;font-weight:700}
</style>
<rect width="820" height="430" fill="#F4F4F2"/>
<text class="m" font-size="10" font-weight="600" letter-spacing="1.6" x="20" y="28" fill="#575C61">TWO ORGANISATIONS · TWO DEFINITIONS · SHARE OF RUNS REPORTED · LOG SCALE</text>
<g stroke="#C5C7C1" stroke-width="1">
  <line x1="140" y1="60" x2="770" y2="60"/><line x1="140" y1="98" x2="770" y2="98"/>
  <line x1="140" y1="136" x2="770" y2="136"/><line x1="140" y1="174" x2="770" y2="174"/>
  <line x1="140" y1="212" x2="770" y2="212"/>
</g>
<line x1="140" y1="250" x2="770" y2="250" stroke="#141619" stroke-width="1.25"/>
<g class="m" font-size="10" fill="#575C61" text-anchor="end">
  <text x="128" y="64">100%</text><text x="128" y="102">10%</text><text x="128" y="140">1%</text>
  <text x="128" y="178">0.1%</text><text x="128" y="216">0.01%</text><text x="128" y="254">0.001%</text>
</g>
<rect x="245" y="226.1" width="110" height="23.9" fill="#33456B"/>
<rect x="505" y="101.3" width="110" height="148.7" fill="#A93A16"/>
<text class="n" x="300" y="216" font-size="28" fill="#33456B" text-anchor="middle">0.004%</text>
<text class="n" x="560" y="91" font-size="28" fill="#A93A16" text-anchor="middle">8.20%</text>
<text class="m" font-size="11" x="300" y="199" fill="#575C61" text-anchor="middle">6 of 141,006 runs</text>
<text class="m" font-size="11" x="560" y="74" fill="#575C61" text-anchor="middle">10 of 122 runs</text>
<g class="m" font-size="11.5" font-weight="600" fill="#141619" text-anchor="middle">
  <text x="300" y="270">ANTHROPIC</text><text x="560" y="270">UK AISI</text>
</g>
<line x1="180" y1="284" x2="420" y2="284" stroke="#C5C7C1"/>
<line x1="440" y1="284" x2="680" y2="284" stroke="#C5C7C1"/>
<g class="m" font-size="10.5" fill="#575C61">
  <text x="180" y="302" fill="#33456B" font-weight="600">COUNTED</text>
  <text x="180" y="318">Runs in which a model reached real</text>
  <text x="180" y="332">production infrastructure, from an</text>
  <text x="180" y="346">environment intended to be sealed.</text>
  <text x="180" y="366" fill="#33456B" font-weight="600">CONDITIONS</text>
  <text x="180" y="382">Internet access accidental.</text>
  <text x="440" y="302" fill="#A93A16" font-weight="600">COUNTED</text>
  <text x="440" y="318">Runs containing any action outside</text>
  <text x="440" y="332">the authorised range, in an environment</text>
  <text x="440" y="346">intentionally connected to the internet.</text>
  <text x="440" y="366" fill="#A93A16" font-weight="600">CONDITIONS</text>
  <text x="440" y="382">Internet on, cyber classifiers off.</text>
</g>
<text class="n" x="180" y="414" font-size="19" fill="#8E9095">1,926×</text>
<line x1="178" y1="408" x2="252" y2="408" stroke="#A93A16" stroke-width="1.5"/>
<text class="m" font-size="10.5" x="264" y="413" fill="#575C61">The ratio between these two numbers is not a finding. It is the artefact this chart exists to show.</text>
</svg>
