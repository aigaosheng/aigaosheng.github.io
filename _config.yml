# Default og:image / twitter:image for every page.
#
# This has to go through front matter defaults, not a top-level `image:` key:
# jekyll-seo-tag 2.8.0 reads page["image"] only (image_drop.rb) and has no
# site-level fallback, so a bare site.image is silently ignored. Setting it as
# a default gives every document a page.image that the plugin does pick up,
# and any post can still override it in its own front matter.
#
# Supplying an image also upgrades twitter:card from "summary" to
# "summary_large_image" and adds twitter:image (see the plugin's template.html).
# Crawlers fetch this server-side, so its file size does not affect page weight.
defaults:
  - scope:
      path: ""
    values:
      # og:image / twitter:image. Was rawa-sun-falling3.jpg: a 2016x1512 photo
      # at 461 KB in a 4:3 aspect that every social crawler then letterboxes.
      # og-default.jpg is the same scene at the 1200x630 that Facebook, X and
      # LinkedIn all specify, at 110 KB.
      image: /image/og-default.jpg
      # Scrim opacity behind the white hero text. The hero photo is bright, so
      # without this the title and subheading were unreadable over the sky.
      # Override per page/post, or set 0 to remove.
      header-mask: 0.45


# Featured Tags
featured-tags: true                     # 是否使用首页标签
# A tag must be used MORE than this many times to appear in the sidebar cloud.
# This was 1, which admitted every tag used twice or more -- 786 links rendered
# into the sidebar of all ~2,000 pages, making each page ~340 KB of boilerplate
# around ~2.4 KB of article. 24 keeps the cloud at roughly 35 meaningful tags.
featured-condition-size: 24
# Hard ceiling on sidebar tag links, so the cloud cannot silently grow back
# as more posts are added and more tags cross the threshold above.
featured-tags-max: 40



# Progressive Web Apps
chrome-tab-theme-color: "#000000"
service-worker: true


# Friends
friends: [
    {
        title: "",
        href: ""
    },
]
