# destination: site_staging
timezone: "Asia/Singapore"

# Site settings
title: AI-driven Business Transformation | Consulting & Development
# Short label for the navbar. site.title is a consulting strapline that wraps
# onto three lines on a phone; it is still used for <title> and metadata.
brand: AISeng Tech
# Homepage / fallback <title>. Every other page now gets
# "<page title> · <title_suffix>" instead of having this whole string appended
# to it -- see _includes/head.html.
SEOTitle: "AISeng Tech - Enterprise AI, Fintech & Payments Briefs"
# Brand string appended to every page title. Keep it short: the SERP title cap
# is around 60 characters and the page's own title has to fit first.
title_suffix: "AISeng Tech"
# The hero band behind the page title, on nearly every page of the site.
#
# This was "image/rawa-sun-falling2-a" -- extensionless, so GitHub Pages served
# it as application/octet-stream, and a 1032x361 photo saved as PNG at 747 KB.
# It was the single largest asset on every pageview and the dominant Largest
# Contentful Paint cost. image/hero-beach.jpg is the same photograph, recropped
# from the full-resolution original at 1600x560, progressive JPEG, 123 KB.
header-img: image/hero-beach.jpg
email: goseng123@gmail.com
author: Sheng Gao
# Used by jekyll-seo-tag for <meta name="description">, og:description and
# twitter:description on any page that does not supply its own. It was
# commented out, so the feed had an empty <description> and there was no
# site-level fallback anywhere.
description: "Daily briefs and analysis on enterprise agentic AI, fintech and payments, tokenization, and AI governance, plus consulting and development services."
keyword: Enterprise Agentic AI, digital Transformation, Tokenization payment
# MUST match CNAME (aisengtech.com). This said https://www.aisengtech.com,
# but www 301-redirects to the apex, so every canonical URL, sitemap entry
# and feed link pointed at a redirect. robots.txt already used the apex.
url: "https://aisengtech.com"
# Explicitly empty. The site is served from the apex domain via CNAME, so there
# is no path prefix. Left unset, jekyll-github-metadata guesses one -- locally
# it inferred "/pages/aigaosheng" and every site.baseurl-prefixed asset URL,
# including the publisher logo in the article JSON-LD, came out wrong. Setting
# it here makes a local build byte-identical to the GitHub Pages build.
baseurl: ""
# Publisher logo. jekyll-seo-tag emits a publisher Organization (with this as
# its logo) in the article JSON-LD only when site.logo is set; without it the
# BlogPosting had an author but no publisher, which Google's article guidance
# lists as recommended and Discover leans on. PLACEHOLDER: this is cropped from
# the author photo. Replace it with a real wordmark when there is one.
logo: /image/logo.png
github_repo: "https://github.com/aigaosheng/aigaosheng.github.io.git"

# Navigation bar, in order.
#
# The nav used to loop over site.pages and print every page that had a title,
# so link order was filesystem-dependent and any new page joined the bar
# automatically -- which would now mean all 15 series pages. Listing the links
# here keeps the bar deliberate. Peripheral pages (Resume, Privacy & Support)
# moved to the footer rather than disappearing.
nav:
  - title: Home
    url: /
  - title: Series
    url: /series/
  - title: Tags
    url: /tags/
  - title: About
    url: /about/
  - title: Services
    url: "/products&services/"
  - title: Search
    url: /search/

# Secondary links, footer only.
nav_secondary:
  - title: Resume
    url: /resume/
  # Was "Privacy & Support" -> /Privacy&Support/. That page is the landing page
  # for Wraith, a separate product: it describes an on-device iOS assistant and
  # says nothing about this site's analytics or advertising, which AdSense's
  # program policies require a publisher to disclose. The page itself is left
  # in place and still reachable at its own URL, which is likely registered
  # outside this repo; only this site's footer link moved.
  - title: Privacy
    url: /privacy/

# Sidebar settings
sidebar: true                           # whether or not using Sidebar.
sidebar-about-description: Artificial intelligence, Agentic AI, machine learning, data science, Expert Developers
sidebar-avatar: /image/gs.jpg     

# SNS settings
linkedin_username:    dlsheng 
github_username:    aigaosheng


# Build settings
# from 2016, 'pygments' is unsupported on GitHub Pages. Use 'rouge' for highlighting instead.
permalink: pretty
paginate: 12
exclude: ["less","node_modules","Gruntfile.js","package.json","README.md", "draft", "docs", "img"]
anchorjs: true 



# Google Analytics 4 measurement ID and AdSense publisher ID.
#
# Both were hard-coded in _includes/head.html. They live here so that the
# jekyll.environment gate in that file governs both, and so local previews stop
# writing page_view hits into the live property.
google_analytics: G-KTDMZH87NL
adsense_client: ca-pub-8709587192438304

# In-article ad slots, rendered by _includes/ad-unit.html into the post layout.
#
# Leave these blank until the units exist in AdSense (Ads -> By ad unit ->
# Display ads). Nothing is rendered for a blank slot, so a missing ID degrades
# to no ad rather than to a broken empty <ins> reserving vertical space.
#
# Why manual units at all, when Auto ads is already on: Auto ads places eight
# 375x375 slots on mobile and exactly one collapsed 0x0 slot on desktop, so
# desktop is effectively unmonetised while mobile is over-dense. Three
# deliberate units cover both. After these are live, switch OFF Auto ads'
# in-page placements in the AdSense dashboard and keep only the anchor,
# otherwise both systems place ads and the page fills up with them.
adsense_slots:
  post_top: ""
  post_mid: ""
  post_end: ""

# Gems
# from PR#40, to support local preview for Jekyll 3.0
#
# jekyll-sitemap was dropped in favour of the hand-written sitemap.xml at the
# repo root. The plugin has no way to exclude the 219 /pageN/ pagination pages
# or /search/, all of which are listing pages with no content of their own;
# submitting them spread crawl attention across 2,892 URLs and earns
# "Indexed, though blocked" / "Crawled - currently not indexed" reports in
# Search Console. The replacement lists posts and real pages only.
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate

# Static HTML that lives outside Jekyll's page collection (no front matter, so
# it never appears in site.pages) but was listed by jekyll-sitemap and should
# stay indexed. These belong to other products hosted from the same repo; the
# files themselves are not to be modified.
sitemap_extra:
  - /deltabrief-site/
  - /deltabrief-site/privacy.html
  - /deltabrief-site/support.html
  - /wraith-site/
  - /wraith-site/privacy.html
  - /wraith-site/support.html


# Markdown settings
# replace redcarpet to kramdown,
# although redcarpet can auto highlight code, the lack of header-id make the catalog impossible, so I switch to kramdown
# document: http://jekyllrb.com/docs/configuration/#kramdown
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM                            # use Github Flavored Markdown !important



# 评论系统
#Disqus（https://disqus.com/）
# disqus_username: aigaosheng-github-io
# disqus:
#   enable: False    #是否开启Disqus评论
