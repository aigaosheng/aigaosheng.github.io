# Build settings
# from 2016, 'pygments' is unsupported on GitHub Pages. Use 'rouge' for highlighting instead.
permalink: pretty
paginate: 60
exclude: ["less","node_modules","Gruntfile.js","package.json","README.md", "draft", "docs", "img"]
anchorjs: true 



# Gems
# from PR#40, to support local preview for Jekyll 3.0
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate


# Markdown settings
# replace redcarpet to kramdown,
# although redcarpet can auto highlight code, the lack of header-id make the catalog impossible, so I switch to kramdown
# document: http://jekyllrb.com/docs/configuration/#kramdown
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM                            # use Github Flavored Markdown !important



# 评论系统
#Disqus（https://disqus.com/）
# disqus_username: aigaosheng-github-io
# disqus:
#   enable: False    #是否开启Disqus评论
#   username: aigaosheng-github-io

# Featured Tags
featured-tags: true                     # 是否使用首页标签
# A tag must be used MORE than this many times to appear in the sidebar cloud.
# This was 1, which admitted every tag used twice or more -- 786 links rendered
# into the sidebar of all ~2,000 pages, making each page ~340 KB of boilerplate
# around ~2.4 KB of article. 24 keeps the cloud at roughly 35 meaningful tags.
featured-condition-size: 24
# Hard ceiling on sidebar tag links, so the cloud cannot silently grow back
# as more posts are added and more tags cross the threshold above.
featured-tags-max: 40



# Progressive Web Apps
chrome-tab-theme-color: "#000000"
service-worker: true


