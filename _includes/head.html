<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="google-site-verification" content="xBT4GhYoi5qRD5tr338pgPM5OWHHIDR6mNg1a3euekI" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--meta name="description" content="{{ site.description }}"> -->
    <!--meta name="keywords"  content="{{ site.keyword }}"> -->
    <!--meta name="keywords" content="{{ page.keywords | join: ', ' }}"> -->
    <meta name="keywords" content="{{ page.keywords | join: ', ' }}">
    <meta name="theme-color" content="{{ site.chrome-tab-theme-color }}">

    <title>{% if page.title %}{{ page.title }} - {{ site.SEOTitle }}{% else %}{{ site.SEOTitle }}{% endif %}
    </title>

    <!--
        jekyll-seo-tag. It was listed in _config.yml plugins but never invoked,
        so the plugin did nothing: the site had no og: or twitter: tags at all
        and shared links previewed bare.

        title=false keeps the hand-written <title> above, so ~2,600 existing
        page titles are left exactly as they were. Everything else comes from
        the plugin: description, canonical, og:*, twitter:* and JSON-LD.

        The hand-rolled tags it replaces were removed rather than kept, to
        avoid emitting each one twice:
          - meta name="description" was page.title followed by the keywords
            list, i.e. a keyword list rather than a description.
          - link rel="canonical" was built from site.url by hand.

        NOTE: do not write Liquid tags in these comments. Liquid runs before
        the HTML is parsed, so anything in braces here still executes.
    -->
    {% seo title=false %}


    <!-- Web App Manifest -->
    <!-- <link rel="manifest" href="{{ site.baseurl }}/pwa/manifest.json"> -->

    <!-- Favicon -->
    <link rel="shortcut icon" href="{{ site.baseurl }}/image/favicon.ico">

    <!-- Safari Webpage Icon    by-BY -->
    <link rel="apple-touch-icon" href="{{ site.baseurl }}/image/rawa-sun-falling3.jpg">
    
    <!-- Canonical URL is emitted by the seo tag above, from site.url + page.url -->

    <!-- Bootstrap Core CSS -->
    <link rel="stylesheet" href="{{ "/css/bootstrap.min.css" | prepend: site.baseurl }}">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ "/css/hux-blog.min.css" | prepend: site.baseurl }}">

    <!-- Additions layered on the theme; see css/enhancements.css -->
    <link rel="stylesheet" href="{{ "/css/enhancements.css" | prepend: site.baseurl }}">

    <!-- Pygments Github CSS -->
    <link rel="stylesheet" href="{{ "/css/syntax.css" | prepend: site.baseurl }}">

    <!-- Custom Fonts -->
    <!-- <link href="http://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet" type="text/css"> -->
    <!-- Hux change font-awesome CDN to qiniu -->
    <link href="//cdnjs.cloudflare.com/ajax/libs/font-awesome/4.6.3/css/font-awesome.min.css" rel="stylesheet" type="text/css">
