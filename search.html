---
layout: default
title: Search
---

<div style="max-width: 800px; margin: 40px auto; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
  <h1>Search the Site</h1>
  <input type="text" id="search-input" placeholder="Type to search..." style="width: 100%; padding: 12px; font-size: 1rem; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 30px;" autocomplete="off" />

  <div id="search-results">
    <p id="result-count" style="font-weight: bold; margin-bottom: 10px;"></p>
    <ul id="results-list" style="list-style: none; padding: 0; margin: 0;"></ul>
  </div>
</div>

<!-- Load Lunr.js from CDN -->
<script src="https://cdn.jsdelivr.net/npm/lunr@2.3.9/lunr.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const searchInput = document.getElementById('search-input');
  const resultList = document.getElementById('results-list');
  const resultCount = document.getElementById('result-count');

  // Load search index
  fetch('/search-data.json')
    .then(response => response.json())
    .then(data => {
      // Build Lunr index
      const idx = lunr(function () {
        this.ref('id');
        this.field('title', { boost: 20 });
        this.field('content', { boost: 5 });
        this.field('url');

        data.index.forEach(doc => {
          this.add(doc);
        });
      });

      // Map ID back to original document
      const documents = {};
      data.index.forEach(doc => {
        documents[doc.id] = doc;
      });

      // Handle search
      searchInput.addEventListener('keyup', function() {
        const query = this.value;
        resultList.innerHTML = '';
        resultCount.textContent = '';

        if (!query) return;

        const results = idx.search(query);
        resultCount.textContent = `${results.length} result(s) found`;

        if (results.length === 0) {
          resultList.innerHTML = '<li style="padding: 12px; color: #666;">No results found. Try another keyword.</li>';
          return;
        }

        results.forEach(result => {
          const doc = documents[result.ref];
          const li = document.createElement('li');
          li.style.padding = '12px 0';
          li.style.borderBottom = '1px solid #eee';

          const a = document.createElement('a');
          a.href = doc.url;
          a.innerHTML = `<strong>${doc.title}</strong>`;
          a.style.textDecoration = 'none';
          a.style.color = '#0366d6';
          a.style.display = 'block';
          a.style.marginBottom = '4px';

          const excerpt = document.createElement('p');
          excerpt.textContent = doc.content.substring(0, 150) + '...';
          excerpt.style.color = '#555';
          excerpt.style.fontSize = '0.9rem';
          excerpt.style.margin = '0';

          li.appendChild(a);
          li.appendChild(excerpt);
          resultList.appendChild(li);
        });
      });
    })
    .catch(err => {
      console.error('Failed to load search index:', err);
      resultList.innerHTML = '<li style="color: red;">Search index failed to load.</li>';
    });
});
</script>
